name: grounded_gemma
tier: 5
paradigm: grounded_llm
question: >
  does grounding the same LLM in retrieved candidates help, over the ungrounded LLM and
  over its retriever alone
design: >
  retrieve(dense_retrieval as configured, top-10) → [gate: candidates?] no: abstain
  (selection.no_candidates, no LLM call) / yes: LLM select(gemma-4-12b-it, numbered list
  → index or refuse) → chosen candidate. Output: refused → no prediction,
  selection.abstained; unparseable / out-of-list → no prediction, violation in selection
  and error.
description: >
  Tier 5. Retrieval-augmented, not routed: dense retrieval supplies candidates,
  the model selects one from the numbered list or declines.

  The retriever is tier 3 itself, not a new one, so a comparison against tier 3
  isolates the selection step. Abstention is a first-class answer -- declining
  when the right place is absent is correct behaviour, not failure. A selection
  that names anything outside the list is recorded as a violation in `error`,
  so a grounded system ignoring its grounding is visible rather than scored as
  an ordinary wrong guess.

  Revision 3 (2026-11-26), run on dev 26-27 Nov (results/dev_rev3/): the
  prompt declines only when no candidate is the location (src/llm_grounded.py,
  prompt v2). After that run the dense index is pinned (index_signature): the
  index this configuration retrieved from on 27 Nov, which dense_retrieval now
  loads too, so the comparison between them shares one retriever
  (results/REVISIONS.md).
ner:
  model: null
  entity_types: null
linking:
  backend: none
  refined_model: null
  refined_entity_set: null
  top_n: 10
rerank:
  model: null
  enabled: false
llm:
  provider: vse
  model: gemma-4-12b-it
  revision: null
  temperature: 0.0
  top_p: null
  prompt_template: v1
  cache_name: gemma4_12b
dense:
  encoder: shared          # configs/shared.yaml
  pool: gold_plus_answers_described
  top_k: 10
  index_fields: [label, description, aliases, country, continent]
  index_signature: "3530d31fa83aacb7"   # pinned revision 3 index (src/dense_index.py)
  query_prefix: shared
  passage_prefix: shared
grounded:
  candidate_source: dense
  top_k: 10
