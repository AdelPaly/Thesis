name: qwen3_vl_v2
tier: 4
paradigm: ner_free
question: >
  how much of the LLM's error is the resolver: qwen3_vl with coordinates in the
  answer and a resolver that uses them and the country
design: >
  LLM(qwen3-vl:235b-a22b-instruct, VSE gateway, temperature 0, prompt v2 → JSON
  city/country/continent/latitude/longitude/refused) → resolve (src/resolver.py):
  Wikidata search for the city, 10 results → those in the named country → the one
  nearest the model's coordinates → else country, else continent string only. The
  record's `resolution` says resolved, declined, unreadable, not_found or ambiguous.
description: >
  NOT one of the eleven reported configurations. Added after the test results
  were scored, when the error analysis showed that the v1 resolver ignores the
  country the model names. Kept in configs/posthoc/ so that run_all.py, the
  summary tables and the dense pool do not see it; its predictions go to
  results/posthoc/. The rule was fixed on the development split.
