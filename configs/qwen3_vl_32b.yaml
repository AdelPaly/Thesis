name: qwen3_vl_32b
tier: 4
paradigm: ner_free
question: >
  does the size of the model matter within one family: qwen3_vl (235B in total,
  22B active, mixture of experts) against the dense 32B of the same line; same
  design and prompt as gemma4 and qwen3_vl
design: >
  LLM(qwen3-vl:32b-instruct, VSE gateway, temperature 0, prompt v4 → JSON
  place/country/continent/latitude/longitude/refused) → resolve (src/resolver.py,
  rule v4): Wikidata search for the place, 10 results (50 when none of the 10 is
  in the named country, or when the one that is lies more than 25 km from the
  model's coordinates) → those in the named country (country name matched
  against the Wikidata country items first) → among several, the first within
  25 km of the model's coordinates → else country, else continent string only
  (no QID, no coords) → prediction. No candidate list. The record's
  `resolution` says resolved, declined, empty, unreadable, not_found,
  ambiguous or error.
description: >
  Tier 4, LLM only: qwen3_vl with a smaller model of the same line, so a
  difference between the two is a difference of size within one family.
  Qwen3-VL 32B (instruct, dense), text input only, served by the VSE gateway,
  like qwen3_vl (Qwen3-VL 235B-A22B: 235B parameters in total, about 22B active
  per token). It took no part in writing, judging or auditing the dataset.

  Added in revision 3 (2026-11-26), before any run of it, with the prompt and
  rule of revision 3 (prompt v4, rule v4), so it is compared with the revision 3
  runs of qwen3_vl and gemma4, not with their reported runs. Its own response
  cache, qwen3_vl_32b_v4.

  Its predictions must not be in results/predictions/ before grounded_gemma
  has run: the dense pool reads every other configuration's answers from there
  (see results/REVISIONS.md, the pool of grounded_gemma).
