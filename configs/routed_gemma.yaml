name: routed_gemma
paradigm: routed
description: >
  Routed configuration with the rebuilt gate. The gate reads three properties
  of the INPUT, computed before any system runs: is a toponym present (a LOC
  span), is that toponym ambiguous (gazetteer candidate count), and how many
  non-LOC entity spans are present.

    no toponym, entity spans present             -> linking path
    toponym present, unambiguous                 -> linking path
    toponym present, ambiguous, entities present  -> linking path, the entity
                                                    disambiguates the toponym
    toponym present, ambiguous, no entity spans  -> LLM
    nothing detected                             -> LLM

  Hand-specified, not learned. The single threshold (ambiguity_threshold) is
  fitted on the dev split only.

  Contrast refined_gemma -- no longer a configuration, but its result is still
  reported as a comparison -- whose gate asked whether ReFinED had linked a LOC to
  a geographic QID. That reads the first system OUTPUT, which makes it a
  fallback rather than a router, and explains the collapse under noise: a
  noisy toponym still links to a geographic QID, so the gate fires and sends a
  poisoned input down the ReFinED path.
ner:
  model: flair/ner-large
  entity_types: [LOC, PER, ORG]
linking:
  backend: refined
  refined_model: wikipedia_model
  refined_entity_set: wikipedia
  search_fallback: false
  top_n: 10
rerank:
  model: intfloat/multilingual-e5-base
  enabled: true
llm:
  backend: gemma
  model: gemma-3-12b-it
  cache_name: gemma
routing:
  enabled: true
  gate: input_properties
  fallback: llm
  ambiguity_threshold: 8
  gazetteer: wikidata
  gazetteer_top_n: 10
