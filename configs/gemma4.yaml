name: gemma4
tier: 4
paradigm: ner_free
question: >
  does parametric knowledge (LLM alone, whole text) beat mention detection and
  retrieval; matched control for grounded_gemma
design: >
  LLM(gemma-4-12b-it, VSE gateway, temperature 0, prompt v5 → JSON
  place/country/continent/latitude/longitude/refused) → resolve
  (src/resolver.py, rule v4, set by llm.resolver_rule): Wikidata search for the
  place, 10 results (50 when none of the 10 is in the named country, or when
  none in it lies within 25 km of the model's coordinates) → those in the
  named country (country name matched against the Wikidata country items
  first) → among several, the first within 25 km of the model's coordinates →
  else country, else continent string only (no QID, no coords) → prediction.
  No candidate list. The record's `resolution` says resolved, declined, empty,
  unreadable, not_found, ambiguous or error.
description: >
  Tier 4, LLM only, and the matched ungrounded control for tier 5: same model
  as grounded_gemma, so the grounded-vs-ungrounded comparison measures the
  grounding rather than a model change.

  Google Gemma 4 12B (instruction tuned), reading the whole text in one pass.
  No mention detection stage: the model is asked for place / country /
  continent directly, and the answer is resolved against Wikidata. A
  continent-only answer carries no coordinate.

  Resolver corrected on 2026-11-22. The first runs (prompt v1) took the first
  Wikidata search result for the city and ignored the country the model named.
  The rule was corrected on the development split only and then run once on
  the test split. The first runs are kept in results/posthoc/original/; see
  results/REVISIONS.md.

  Revision 3 (2026-11-26), run on dev 26-27 Nov (results/archive/dev_rev3/): prompt v4
  asks for the location itself, "a city, town or village, or any other named
  place", rather than a city, and keeps one refusal rule (refuse only if the
  text has no geographic signal). Its wording names no place type of the
  dataset. Rule v4 is rule v3 (the audit's wider search) on the "place" field,
  with four corrections (src/resolver.py). Cache gemma4_12b_v4.

  After that dev run: on posts with clues only, v4 made the model name streets,
  venues and clubs with no Wikidata item, and rule v4 fell straight back to the
  country. A first prompt v5 added a "settlement" field, with rule v5 searching
  it (cache gemma4_12b_v5, results/archive/dev_rev3b/); the model then named a landmark
  as the place and the town as the settlement, and exact on B fell. It was
  replaced. Prompt v5 is now v4 with its second paragraph replaced: for a
  building, street or venue it asks for the city, town or village it is in,
  and for a person, organisation or event the place where they are. Same JSON
  fields as v4, resolved with rule v4 (llm.resolver_rule), cache gemma4_12b_v5b
  (results/archive/dev_rev3c/; results/REVISIONS.md). The reported runs (commit
  0389a2d) used prompt template v3 (the v2 prompt, cache gemma4_12b_v2).
