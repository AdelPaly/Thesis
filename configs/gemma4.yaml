name: gemma4
tier: 4
paradigm: ner_free
description: >
  Tier 4, LLM only, and the matched ungrounded control for tier 5: same model
  as grounded_gemma, so the grounded-vs-ungrounded comparison measures the
  grounding rather than a model change.

  Google Gemma 4 31B (instruction tuned), reading the whole text in one pass.
  No mention detection stage: the model is asked for city / country /
  continent directly, and the answer is resolved against Wikidata. A
  continent-only answer carries no coordinate.
