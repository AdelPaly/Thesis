name: two_stage
paradigm: ner_dependent
description: >
  Flair NER over every tag, Wikidata wbsearchentities top-10 retrieval per
  mention pushed through the geographic property chain, E5 cross-candidate
  rerank, top-1. No entity linker: disambiguation is done entirely by the
  reranker over the retrieved candidate set.
ner:
  model: flair/ner-large
  entity_types: null
linking:
  backend: wikidata_search
  refined_model: null
  refined_entity_set: null
  search_fallback: false
  top_n: 10
rerank:
  model: intfloat/multilingual-e5-base
  enabled: true
llm:
  backend: null
  model: null
routing:
  enabled: false
  gate: null
  fallback: null
