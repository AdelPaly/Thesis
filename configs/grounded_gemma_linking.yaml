name: grounded_gemma_linking
tier: 5
paradigm: grounded_llm
question: >
  does grounding help because of the LLM or because of the retriever (linking vs dense
  candidates)
design: >
  NER(flair/ner-large, LOC/PER/ORG) → link(ReFinED, as refined) → resolve(property
  chain) → distinct place QIDs by linker confidence, top-10 (no rerank) → [gate:
  candidates?] no: abstain (selection.no_candidates, no LLM call) / yes: LLM
  select(gemma-4-12b-it, as grounded_gemma) → chosen candidate. Output: as
  grounded_gemma.
description: >
  Tier 5, second variant. Identical to grounded_gemma except that the
  candidates come from entity linking (tier 2b) instead of dense retrieval
  (tier 3).

  The pair answers a question neither variant can answer alone: does grounding
  help because of the LLM or because of the retriever? Same model, same prompt,
  same selection contract, different candidate source. Decided on dev only.
ner:
  model: flair/ner-large
  entity_types: [LOC, PER, ORG]
linking:
  backend: refined
  refined_model: wikipedia_model
  refined_entity_set: wikipedia
  top_n: 10
rerank:
  model: null
  enabled: false
llm:
  provider: vse
  model: gemma-4-12b-it
  revision: null
  temperature: 0.0
  top_p: null
  prompt_template: v1
  run_date: null
  cache_name: gemma4_12b
grounded:
  candidate_source: linking
  top_k: 10
