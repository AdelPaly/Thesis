name: baseline_majority
tier: "0"
paradigm: baseline
description: >
  Majority baseline. Always predicts the most frequent gold place in the DEV
  split of whichever dataset is being run, and ignores the text entirely. It
  reads no input, so it measures exactly how much of a headline number the
  label distribution carries on its own. Fitted on dev by construction: a
  majority computed over test would be reading the answer sheet.
