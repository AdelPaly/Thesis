name: dense_retrieval
tier: 3
paradigm: dense_retrieval
description: >
  Tier 3. No mention detection, no entity linking, no LLM: embed the post,
  embed a text description of every candidate place, take nearest neighbours.

  This is the cell that separates "no mention-detection stage" from
  "parametric knowledge". Without it every NER-free system in the comparison
  happens to be an LLM, so the headline contrast cannot tell the two apart.

  The encoder is the one the reranker already uses, so the comparison against
  tier 2 is not confounded by a different encoder. E5 is trained with
  asymmetric query/passage prefixes for retrieval, so they are set explicitly
  here rather than left implicit.

  index_fields defines what the tier can possibly retrieve: a place whose
  indexed text says nothing about football cannot be retrieved from a post
  about football. The pool defines the difficulty, and both are recorded in
  the index metadata and reported.
ner:
  model: null
  entity_types: null
linking:
  backend: none
  refined_model: null
  refined_entity_set: null
  top_n: 10
rerank:
  model: null
  enabled: false
llm:
  provider: null
  model: null
dense:
  encoder: shared          # configs/shared.yaml
  pool: gold_plus_predicted
  top_k: 10
  index_fields: [label, description, aliases, country, continent]
  query_prefix: shared
  passage_prefix: shared
# NOTE: the tier-2 reranker (src/ranking.py) encodes the raw text and raw
# descriptions with NO query:/passage: prefixes, whereas this tier applies them.
# Same encoder, different input formatting, so the two tiers are not strictly
# like-for-like. Left as is deliberately: changing it would change results.
