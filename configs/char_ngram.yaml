name: char_ngram
tier: 0
paradigm: baseline
description: >
  Character n-gram floor. Every dev place gets a profile of the character
  n-grams (lengths 2 to 5) over its dev texts; a post is scored against every
  profile by cosine overlap and the best-matching place is predicted. No
  toponym input, no gazetteer, no network: surface form only. It answers
  whether a result comes from the entity clue or from surface statistics that
  correlate with region.

  Fitted on the dev split of whichever dataset is being run, like
  majority_class. A place is either dev or test, so on test this configuration
  cannot be exactly right by construction; its exact-match floor is a dev
  number, and on test it measures country and continent only. A dev item is
  scored with its own text removed from its place's profile.
